<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return origFetch; },
            set: function(val) { origFetch = val; }
          });
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Settings — FinSight</title>
    <meta name="description" content="Manage your FinSight user profile, security settings, and password." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#ECEEF2] text-[#1A1F26] min-h-screen p-3 sm:p-5 lg:p-7 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    
    <div class="max-w-[1440px] mx-auto bg-white rounded-[28px] sm:rounded-[36px] p-5 sm:p-7 lg:p-9 shadow-card border border-slate-200/80">
      
      <!-- Top Navigation Bar -->
      <header class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-7 border-b border-slate-100">
        <a href="/dashboard.html" class="flex items-center gap-2.5 focus:outline-none">
          <div class="w-9 h-9 rounded-full bg-[#0F5B41] flex items-center justify-center text-white shadow-xs">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.5a2.5 2.5 0 0 1-2.5-2.5V8a2.5 2.5 0 0 1 5 0v2" />
            </svg>
          </div>
          <span class="text-xl font-bold tracking-tight text-slate-900">FinSight</span>
        </a>

        <nav class="flex items-center bg-slate-100/80 p-1.5 rounded-full text-xs font-semibold text-slate-600 shadow-inner">
          <a href="/dashboard.html" class="px-4 py-1.5 rounded-full hover:text-slate-900 transition-colors">Dashboard</a>
          <a href="/upload.html" class="px-4 py-1.5 rounded-full hover:text-slate-900 transition-colors">Reports</a>
          <a href="/transactions.html" class="px-4 py-1.5 rounded-full hover:text-slate-900 transition-colors">Documents</a>
          <a href="/transactions.html" class="px-4 py-1.5 rounded-full hover:text-slate-900 transition-colors">History</a>
          <a href="/insights.html" class="px-4 py-1.5 rounded-full hover:text-slate-900 transition-colors">Contacts</a>
        </nav>

        <div class="flex items-center gap-3">
          <button class="btn-logout px-4 py-2 rounded-full bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-xs font-bold text-slate-700 transition-all cursor-pointer">
            Sign Out
          </button>
        </div>
      </header>

      <!-- Header Row -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-7 pb-6">
        <div>
          <h1 class="text-3xl font-light text-slate-800 tracking-tight">
            Account & <span class="font-bold text-slate-900">Security</span>
          </h1>
          <p class="text-xs text-slate-500 mt-1">Manage user credentials and database synchronization.</p>
        </div>
      </div>

      <!-- Main Layout -->
      <div class="flex gap-6 pt-2">
        
        <!-- Slim Rail -->
        <aside class="hidden xl:flex flex-col items-center justify-between w-13 py-5 bg-white rounded-3xl border border-slate-200/80 shadow-xs shrink-0 self-stretch">
          <div class="space-y-4 flex flex-col items-center">
            <a href="/dashboard.html" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-800 flex items-center justify-center transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
              </svg>
            </a>
            <a href="/upload.html" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-800 flex items-center justify-center transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
              </svg>
            </a>
            <a href="/transactions.html" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-800 flex items-center justify-center transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </a>
            <a href="/insights.html" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-800 flex items-center justify-center transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </a>
          </div>
          <div>
            <a href="/profile.html" class="w-9 h-9 rounded-xl bg-[#0F5B41] text-white flex items-center justify-center shadow-xs">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </a>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 space-y-6 max-w-4xl">
          
          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-xs space-y-4">
            <h2 class="text-sm font-bold text-slate-900">User Profile</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <div class="text-[11px] text-slate-400">Full Name</div>
                <div id="profile-name" class="text-xs font-bold text-slate-900 mt-1">Sujon Alex</div>
              </div>
              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <div class="text-[11px] text-slate-400">Email Address</div>
                <div id="profile-email" class="text-xs font-bold text-slate-900 mt-1">demo@finsight.app</div>
              </div>
              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <div class="text-[11px] text-slate-400">Member Since</div>
                <div id="profile-joined-date" class="text-xs font-bold text-slate-900 mt-1">June 2026</div>
              </div>
            </div>
          </div>

          <!-- Password update -->
          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-xs space-y-4">
            <h2 class="text-sm font-bold text-slate-900">Update Password</h2>
            <form id="password-change-form" class="space-y-3.5 max-w-md">
              <div>
                <label for="current-password" class="block text-xs font-bold text-slate-700 mb-1">Current Password</label>
                <input
                  id="current-password"
                  type="password"
                  required
                  placeholder="••••••••"
                  class="w-full px-4 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
                />
              </div>

              <div>
                <label for="new-password" class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
                <input
                  id="new-password"
                  type="password"
                  required
                  placeholder="At least 6 characters"
                  class="w-full px-4 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
                />
              </div>

              <div>
                <label for="confirm-new-password" class="block text-xs font-bold text-slate-700 mb-1">Confirm New Password</label>
                <input
                  id="confirm-new-password"
                  type="password"
                  required
                  placeholder="Confirm new password"
                  class="w-full px-4 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
                />
              </div>

              <button
                type="submit"
                id="btn-save-password"
                class="px-5 py-2.5 rounded-full text-xs font-bold text-white bg-[#0F5B41] hover:bg-[#0A4C36] shadow-xs transition-all cursor-pointer"
              >
                Update Password
              </button>
            </form>
          </div>

        </main>

      </div>

    </div>

    <script type="module" src="/frontend/js/profile.js"></script>
  </body>
</html>
