<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return origFetch; },
            set: function(val) { origFetch = val; }
          });
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In & Register — FinSight</title>
    <meta name="description" content="Sign in or create your FinSight account to explore bank statement analytics and cash flow." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#ECEEF2] text-[#1A1F26] min-h-screen flex items-center justify-center p-3 sm:p-6 font-['Plus_Jakarta_Sans',sans-serif]">
    
    <div class="w-full max-w-md bg-white rounded-[32px] sm:rounded-[36px] p-6 sm:p-9 shadow-card border border-slate-200/80 space-y-5">
      
      <!-- Brand Logo & Header -->
      <div class="text-center">
        <a href="/" class="inline-flex items-center gap-2.5 mb-3 focus:outline-none">
          <div class="w-10 h-10 rounded-full bg-[#0F5B41] flex items-center justify-center text-white shadow-xs">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.5a2.5 2.5 0 0 1-2.5-2.5V8a2.5 2.5 0 0 1 5 0v2" />
            </svg>
          </div>
          <span class="text-2xl font-extrabold tracking-tight text-slate-900">FinSight</span>
        </a>
        <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">Financial Intelligence</h2>
        <p class="text-xs text-slate-500 mt-1">Bank statement analysis & cash flow tracking</p>
      </div>

      <!-- Segmented Tab Switcher (Sign In vs Create Account) -->
      <div class="flex items-center bg-slate-100 p-1 rounded-full text-xs font-semibold text-slate-600 shadow-inner">
        <button
          type="button"
          id="tab-signin"
          class="flex-1 py-2 text-xs font-bold rounded-full bg-[#0F5B41] text-white shadow-xs transition-all cursor-pointer"
        >
          Sign In
        </button>
        <button
          type="button"
          id="tab-register"
          class="flex-1 py-2 text-xs font-semibold rounded-full text-slate-500 hover:text-slate-900 transition-colors cursor-pointer"
        >
          Create Account
        </button>
      </div>

      <!-- 1-Click Instant Demo Button (Guaranteed Frictionless Access) -->
      <div class="p-3.5 rounded-2xl bg-emerald-50/80 border border-emerald-200/80 text-center space-y-2">
        <div class="text-[11px] font-bold text-emerald-900 uppercase tracking-wide">Instant Test Environment</div>
        <button
          type="button"
          class="btn-instant-demo w-full py-2.5 px-4 rounded-full bg-[#0F5B41] hover:bg-[#0A4C36] text-white text-xs font-bold shadow-xs transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer"
        >
          <svg class="w-4 h-4 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          <span>1-Click Enter as Sujon Alex (Demo)</span>
        </button>
      </div>

      <!-- Quick Demo Credentials Fill Pill -->
      <div class="text-center">
        <button
          type="button"
          id="btn-demo-fill"
          class="inline-flex items-center gap-1.5 text-[11px] font-semibold text-slate-500 hover:text-[#0F5B41] bg-slate-50 hover:bg-emerald-50/50 px-3 py-1 rounded-full border border-slate-200 transition-all cursor-pointer"
        >
          <span>💡 Autofill Demo Login: demo@finsight.app</span>
        </button>
      </div>

      <!-- Form Error Alert -->
      <div id="form-error" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700 font-medium"></div>

      <!-- ================= SECTION: SIGN IN ================= -->
      <div id="section-login" class="space-y-4">
        <form id="login-form" class="space-y-3.5" novalidate>
          <div>
            <label for="login-email" class="block text-xs font-bold text-slate-800 mb-1">Email address</label>
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="email"
              required
              value="demo@finsight.app"
              placeholder="you@example.com"
              class="w-full px-4 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
            />
          </div>

          <div>
            <label for="login-password" class="block text-xs font-bold text-slate-800 mb-1">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              value="password123"
              placeholder="••••••••"
              class="w-full px-4 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
            />
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" checked class="rounded text-[#0F5B41] focus:ring-[#0F5B41]" />
              <span>Remember me</span>
            </label>
            <span class="text-slate-400">Encrypted with bcrypt</span>
          </div>

          <button
            type="submit"
            id="btn-login-submit"
            class="w-full py-3 px-4 rounded-full text-xs font-bold text-white bg-[#0F5B41] hover:bg-[#0A4C36] shadow-xs active:scale-[0.98] transition-all flex items-center justify-center cursor-pointer mt-1"
          >
            Sign In
          </button>
        </form>
      </div>

      <!-- ================= SECTION: REGISTER ================= -->
      <div id="section-register" class="hidden space-y-4">
        <form id="register-form" class="space-y-3" novalidate>
          <div>
            <label for="register-name" class="block text-xs font-bold text-slate-800 mb-1">Full Name</label>
            <input
              id="register-name"
              name="name"
              type="text"
              required
              placeholder="Alex Morgan"
              class="w-full px-4 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
            />
          </div>

          <div>
            <label for="register-email" class="block text-xs font-bold text-slate-800 mb-1">Email address</label>
            <input
              id="register-email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="alex@example.com"
              class="w-full px-4 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
            />
          </div>

          <div>
            <label for="register-password" class="block text-xs font-bold text-slate-800 mb-1">Password</label>
            <input
              id="register-password"
              name="password"
              type="password"
              required
              placeholder="At least 6 characters"
              class="w-full px-4 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
            />
          </div>

          <div>
            <label for="register-confirm-password" class="block text-xs font-bold text-slate-800 mb-1">Confirm Password</label>
            <input
              id="register-confirm-password"
              name="confirmPassword"
              type="password"
              required
              placeholder="Repeat your password"
              class="w-full px-4 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0F5B41]/20 focus:border-[#0F5B41] transition-all bg-white"
            />
          </div>

          <button
            type="submit"
            id="btn-register-submit"
            class="w-full py-3 px-4 rounded-full text-xs font-bold text-white bg-[#0F5B41] hover:bg-[#0A4C36] shadow-xs active:scale-[0.98] transition-all flex items-center justify-center cursor-pointer mt-2"
          >
            Create Account
          </button>
        </form>
      </div>

      <!-- Footer back link -->
      <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-100">
        <a href="/" class="hover:text-slate-600 font-medium">
          ← Back to FinSight Home
        </a>
      </div>

    </div>

    <!-- Auth Script -->
    <script type="module" src="/frontend/js/auth.js"></script>
  </body>
</html>
